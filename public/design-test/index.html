<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#10110f">
<title>Kushal — ASCII hero study</title>
<style>
@font-face{font-family:Archivo;src:url('./fonts/archivo.woff2') format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box}html,body{margin:0;background:#10110f;color:#eaeae3;font-family:Archivo,sans-serif}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:5px}a:focus-visible,button:focus-visible{outline:1px solid #eaeae3;outline-offset:6px}
.hero{position:relative;isolation:isolate;min-height:680px;height:100svh;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}header{position:absolute;inset:30px 36px auto;display:flex;justify-content:space-between;align-items:start;font-size:14px;line-height:1.25}header span{display:block;color:#a4a59a;font-size:12px;margin-top:6px}nav{display:flex;gap:30px}.identity{position:absolute;left:2.1vw;top:46%;transform:translateY(-50%);margin:0;font-size:clamp(210px,43vw,780px);font-weight:500;line-height:.75;letter-spacing:-.105em;user-select:none;mix-blend-mode:difference;color:#efefe8}.identity span{font-size:.17em;letter-spacing:-.06em;margin-left:.18em;vertical-align:baseline}.intro{position:absolute;left:65%;bottom:20%;width:28%;max-width:350px;font-size:clamp(18px,1.8vw,28px);line-height:1.15;letter-spacing:-.035em;margin:0;text-wrap:balance;text-shadow:0 1px 8px #10110f}footer{position:absolute;inset:auto 36px 28px;display:flex;justify-content:space-between;align-items:end;font-size:12px;line-height:1.4}.name{font-size:16px;letter-spacing:-.025em}.reference{color:#a4a59a;font-size:10px;margin-top:7px}.reference a{text-decoration:underline;text-underline-offset:3px}.motion{font:inherit;color:#c6c8bc;background:#10110f;border:1px solid #55594c;padding:7px 12px;cursor:pointer}.motion:hover{border-color:#eaeae3}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:650px){.hero{min-height:620px}header{inset:22px 20px auto;font-size:12px}header span{font-size:11px}nav{gap:18px}.identity{left:2vw;top:40%;font-size:66vw}.intro{left:37%;bottom:23%;width:55%;font-size:22px}footer{inset:auto 20px 22px;gap:20px}.name{font-size:14px}.reference{max-width:230px;font-size:9px}.motion{font-size:11px;white-space:nowrap}}
</style>
</head>
<body>
<main class="hero" aria-labelledby="hero-title">
 <canvas id="field" aria-hidden="true"></canvas>
 <header><a href="../">Kushal Mamillapalli<span>Data Engineer · Spotify</span></a><nav aria-label="Contact"><a href="https://github.com/Techdude01">GitHub ↗</a><a href="mailto:kushalmam06@gmail.com">Email ↗</a></nav></header>
 <h1 class="identity" id="hero-title" aria-label="Kushal Mamillapalli">km<span aria-hidden="true">.</span></h1>
 <p class="intro">I build recommendation systems and the infrastructure behind them.</p>
 <footer><div><div class="name">I make data go places.</div><div class="reference">Hero study / ASCII field<br>Composition reference: <a href="https://www.awwwards.com/sites/elvis-mao">Elvis Mao</a></div></div><button class="motion" type="button" aria-pressed="false">Pause motion</button></footer>
</main>
<script>
const canvas=document.getElementById('field');
const context=canvas.getContext('2d');
const button=document.querySelector('.motion');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let width=0,height=0,frame=0,last=0,time=0,paused=reduced.matches;
let pointer={x:0,y:0},target={x:0,y:0};
const glyphs=' .,:;-=+*#%@';
function resize(){
 width=innerWidth;height=document.querySelector('.hero').clientHeight;
 const ratio=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);
 context.setTransform(ratio,0,0,ratio,0,0);draw();
}
function draw(){
 context.fillStyle='#10110f';context.fillRect(0,0,width,height);
 const cell=width<650?7:8,step=cell*1.35;
 context.font=`${cell+1}px monospace`;context.textBaseline='top';
 pointer.x+=(target.x-pointer.x)*.035;pointer.y+=(target.y-pointer.y)*.035;
 // Broad folded bands: the characters describe a continuous surface rather than random noise.
 for(let row=0;row<height/step;row++){
  const y=row*step,v=y/height;
  for(let col=0;col<width/cell;col++){
   const x=col*cell,u=x/width;
   const a=u*3.8+v*1.65+Math.sin(v*5.4-time*.18)*.52+pointer.x*.12;
   const b=v*2.7-u*.8+Math.sin(u*6+time*.12)*.28+pointer.y*.08;
   const fold=Math.sin(a*3.5+time*.13)+Math.cos(b*4.1-time*.09)*.57;
   const ridge=Math.exp(-Math.pow(fold/.48,2));
   const contour=Math.pow(.5+.5*Math.cos(a*26+b*4),3);
   const light=Math.max(0,Math.sin(a*3.5+time*.13+.8));
   // Let the foreground text breathe while retaining a full-bleed texture at the edges.
   const readingVoid=Math.exp(-Math.pow((u-.77)/.24,4)-Math.pow((v-.76)/.16,4));
   const density=(ridge*.76+contour*.25+light*.1)*(1-readingVoid*.94);
   if(density<.10)continue;
   const index=Math.min(glyphs.length-1,Math.floor(density*(glyphs.length-1)));
   const shade=Math.round(65+Math.min(1,density)*145);
   context.fillStyle=`rgb(${shade},${shade+2},${shade-7})`;
   context.fillText(glyphs[index],x,y);
  }
 }
}
function tick(now){frame=0;if(paused||document.hidden)return;if(now-last>65){time+=Math.min((now-last)/1000,.1);last=now;draw()}frame=requestAnimationFrame(tick)}
function sync(){cancelAnimationFrame(frame);frame=0;button.textContent=paused?'Play motion':'Pause motion';button.setAttribute('aria-pressed',String(paused));if(!paused&&!document.hidden){last=performance.now();frame=requestAnimationFrame(tick)}}
button.addEventListener('click',()=>{paused=!paused;sync()});
reduced.addEventListener('change',()=>{paused=reduced.matches;sync()});
document.addEventListener('visibilitychange',sync);
window.addEventListener('resize',resize);
window.addEventListener('pointermove',event=>{target.x=event.clientX/width-.5;target.y=event.clientY/height-.5},{passive:true});
resize();sync();
</script>
</body>
</html>
